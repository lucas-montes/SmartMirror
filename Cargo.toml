[package]
name = "assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
cpal = "0.15.3"
hound = "3.5.1"
dasp = "0.11"
vosk = "0.3.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sherpa-onnx = { version = "2.0.3", default-features = false, features = ["static"] }
serde_json = "1.0.154"
ureq = { version = "2", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
